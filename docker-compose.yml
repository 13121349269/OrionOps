# OrionOps 运维管理平台 - Docker Compose
# 包含: MySQL + Redis + InfluxDB + 应用本体

services:
  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: orionops-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: OrionOps@2026
      MYSQL_DATABASE: orion_visor
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pOrionOps@2026"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - orionops-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: orionops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass OrionOps@2026
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "OrionOps@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionops-net

  # ---- InfluxDB ----
  influxdb:
    image: influxdb:2.7-alpine
    container_name: orionops-influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: OrionOps@2026
      DOCKER_INFLUXDB_INIT_ORG: orionops
      DOCKER_INFLUXDB_INIT_BUCKET: orion_visor
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: orionops-influxdb-token-2026
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionops-net

  # ---- OrionOps 应用 ----
  orionops-app:
    image: openjdk:8-jdk-alpine
    container_name: orionops-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orion_visor?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: OrionOps@2026
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: OrionOps@2026
      # InfluxDB
      SPRING_INFLUXDB_URL: http://influxdb:8086
      SPRING_INFLUXDB_TOKEN: orionops-influxdb-token-2026
      SPRING_INFLUXDB_ORG: orionops
      SPRING_INFLUXDB_BUCKET: orion_visor
      # Vault加密密钥 (生产环境必须更换)
      ORION_VISOR_VAULT_AES_KEY: OrionOps-Production-AES-Key-2026-ChangeMe!!
    volumes:
      - ./app:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: java -jar -Xms512m -Xmx1024m -Duser.timezone=Asia/Shanghai orion-visor-launch.jar
    ports:
      - "80:80"
    networks:
      - orionops-net

volumes:
  mysql_data:
  redis_data:
  influxdb_data:

networks:
  orionops-net:
    driver: bridge
